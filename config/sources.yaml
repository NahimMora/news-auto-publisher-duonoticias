    max_items_per_scan: 8

  # --- DESHABILITADOS ---
  - name: ariesonline
    enabled: false
    type: local_news
    scan_interval_minutes: 45
    priority: 78
    category: salta
    base_url: https://ariesonline.com.ar
    parser: html_scraper
    max_items_per_scan: 8
    note: "Bloqueado por Cloudflare 403 - requiere browser automation para activar"

  - name: eloncesalta
    enabled: false
    type: local_news
    scan_interval_minutes: 45
    priority: 76
    category: salta
    base_url: https://eloncesalta.com.ar
    parser: html_scraper
    max_items_per_scan: 8
    note: "Dominio DNS caido - verificar si el sitio sigue activo"

  # --- X / VIRAL ---
  - name: x
    enabled: true
    type: x_video
    scan_interval_minutes: 90
    priority: 85
    category: viral
    base_url: https://x.com
    parser: manual_first
    max_items_per_scan: 8
    handles:
      - https://x.com/TTendenciaX
      - https://x.com/home?lang=es
      - https://x.com/BoludoscnAmarok
      - https://x.com/ceciarmy
      - https://x.com/therealbuni
