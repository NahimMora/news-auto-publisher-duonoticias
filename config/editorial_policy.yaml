# Linea editorial de DUO Noticias (reestructuracion 2026-10).
# La redaccion la aplica editorial/prompting.py (prompt unico) y la valida editorial/captions.py.
# Este archivo documenta la politica; los cambios de tono se hacen en el prompt y suben
# llm.prompt_version en config/editorial_scoring.yaml (invalida la cache de captions).
version: 2
general_tone: "periodistico, argentino, directo, dinamico, cercano, con identidad saltena"
political_line: >-
  Prioridad a lo que afecta a Salta. En medidas conjuntas Provincia-Nacion se destacan los efectos
  concretos para Salta y la cooperacion institucional cuando esten documentados, sin tono
  propagandistico, sin inventar logros, sin omitir datos contrarios sustanciales. Politica nacional
  de rutina no entra (penalidad politica_nacional_rutinaria).

hard_rules:
  - "No inventar datos, cifras, nombres, lugares, fechas, causas ni relaciones."
  - "Policiales: conservar la contundencia de lo verificado; respetar detenido/imputado/acusado/condenado."
  - "Sin humor en muertes, homicidios, tragedias, violencia grave ni victimas."
  - "Sin rotulos de plantilla (Que paso, Por que importa, CTA, Fuente) ni nombre del medio de origen."
  - "Caption total (con emojis, CTA y hashtags) menor a 2000 caracteres."
  - "El mismo caption para Instagram y Facebook."
  - "Videos de X con poco contexto: solo lo que se sostiene; si no se sabe que muestra, no se publica."

hashtags:
  always: ["#DuoNoticias"]
  salta: "#Salta solo si el hecho es salteno (grupo local o relacion_salta=2)"
  national: "#Argentina para nacionales"
  max: 4
  blocked: ["#Milei2027", "#Kirchnerismo", "#AntiK", "#Libertarios", "#Peronismo"]
