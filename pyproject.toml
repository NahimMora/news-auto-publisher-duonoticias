[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duonoticias-autopublicador"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25,<1",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
duonoticias-autopublicador = "duonoticias_autopublicador.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

