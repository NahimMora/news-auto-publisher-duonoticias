sources:
  # --- ESPECTACULOS ---
  - name: paparazzi
    enabled: true
    type: entertainment
    scan_interval_minutes: 60
    priority: 88
    category: espectaculos
    base_url: https://www.paparazzi.com.ar
    parser: wordpress
    max_items_per_scan: 12

  # --- NACIONAL ---
  - name: tn
    enabled: true
    type: news
    scan_interval_minutes: 45
    priority: 76
    category: nacional
    base_url: https://tn.com.ar
    parser: rss_html
    max_items_per_scan: 12

  - name: infobae
    enabled: true
