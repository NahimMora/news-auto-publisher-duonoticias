# Ciclo horario, cupos, cola, relevancia y control de costos (reestructuracion 2026-10).
# Todos los valores son configurables; los umbrales se calibraron con notas reales
# del 2026-10-17/18 (ver docs/REESTRUCTURACION_2026_10.md, seccion Calibracion).
version: 1

cycle:
  # Un ciclo de seleccion y publicacion por hora, alineado al minuto indicado.
  interval_minutes: 60
  align_minute: 0
  # Tiempo maximo de produccion (render + publicacion) por ciclo. Lo que no entra
  # vuelve a la cola sin perder su lugar ni reiniciar su vencimiento.
  production_budget_minutes: 45

quotas:
  # Capacidad maxima por ciclo; no es una obligacion de llenado.
  # 2026-10-18: se quitaron los 2 cupos libres (decision del propietario) -> techo 10.
  max_per_cycle: 10
  groups:
    local: 6
    national: 2
    paparazzi: 2
  free: 0
  # Si se vuelven a habilitar cupos libres: grupos que podrian usarlos (nunca national).
  free_eligible_groups: [local, paparazzi, x_feed]
  # Ninguna fuente local se lleva mas de esta cantidad de los cupos locales de un ciclo.
  max_per_source_per_cycle: 3
  # Tope diario de piezas (0 = sin tope propio). Instagram limita la publicacion por API
  # (content_publishing_limit, 24 h moviles); el publicador lo consulta antes de cada ciclo.
  max_pieces_per_day: 0
  # Instagram: 100 publicaciones por API cada 24 h moviles, contando historias. Las noticias dejan
  # libres estas para historias y formatos (resumen de las 8, dolar, top semanal).
  ig_reserve_for_formats: 15
  # Tope de noticias por ciclo segun la hora local (2026-10-20). Como el cupo de Instagram es de
  # 24 h moviles, lo que se publica a una hora vuelve a estar libre recien a la misma hora del dia
  # siguiente: un tope fijo por hora mantiene el ritmo parejo. Antes (un cuarto de lo que quedaba)
  # la noche se llevaba 4-6 por hora y la tarde siguiente quedaba sin lugar.
  # 6 h x 1 + 18 h x 3 = 60 noticias por dia; las historias y formatos usan unas 27.
  # 2026-10-20: el propietario pidio 10 por ciclo a toda hora para probar si el limite de 100 es real
  # (prueba documentada en docs/PRUEBA_CUPO_INSTAGRAM.md). Ritmo parejo de antes: night 1, day 3.
  # 2026-10-21: prueba terminada (sin rechazos, el uso nunca paso de 90/100; ver docs/PRUEBA_CUPO_INSTAGRAM.md).
  # Con ~85 publicaciones por dia el alcance subio pero las bajas de seguidores pasaron de ~15 a ~90 por dia:
  # el feed de IG lleva ahora solo las mejores notas (ver ig_feed); el resto sale solo en Facebook.
  # Madrugada sin noticias en el feed; 2 por ciclo en horas pico; 1 el resto.
  ig_news_per_hour:
    night_hours: [1, 2, 3, 4, 5, 6]
    night: 0
    peak_hours: [12, 13, 20, 21, 22]
    peak: 2
    day: 1
  # Prueba del limite: no frenar por el cupo que informa la API ni por la reserva para formatos.
  # Si Instagram rechaza, la nota sale igual en Facebook e Instagram queda en pausa (rate_limits).
  # Cada ciclo deja el cupo antes y despues en data/reports/ig_limit_probe.jsonl.
  ig_quota_probe: false
  # Feed de Instagram separado de Facebook (docs/ESTRATEGIA_AUDIENCIA.md). per_day: tope de noticias
  # en el feed de IG por dia local; video_bonus: puntos extra para que entren antes las notas con
  # video (los reels rinden 5-10 veces mas que las imagenes). per_day: 0 vuelve a IG = FB.
  ig_feed:
    per_day: 20
    video_bonus: 10

queue:
  # Una candidata puede esperar como maximo esto desde su primer ingreso elegible.
  pending_ttl_hours: 12
  # Reintentos de produccion/publicacion antes de descartar (errores recuperables).
  max_retries: 3
  # Antiguedad maxima de la nota original para entrar a la cola.
  max_content_age_hours:
    local: 24
    national: 12
    paparazzi: 24
    x_feed: 24

relevance:
  # Componentes 0-10 que devuelve la evaluacion (una llamada por lote) y sus pesos.
  # El puntaje final es 0-100 e interpretable: sum(peso * componente) * 10 - penalidades.
  weights:
    local:
      impacto: 0.25
      urgencia: 0.15
      interes_publico: 0.25
      gravedad: 0.10
      novedad: 0.15
      repercusion: 0.10
    national:
      impacto: 0.20
      urgencia: 0.15
      interes_publico: 0.15
      gravedad: 0.20
      novedad: 0.10
      repercusion: 0.20
    paparazzi:
      protagonista: 0.30
      repercusion: 0.25
      novedad: 0.20
      interes_publico: 0.15
      urgencia: 0.10
    x_feed:
      impacto: 0.20
      interes_publico: 0.25
      novedad: 0.25
      repercusion: 0.20
      urgencia: 0.10
  penalties:
    # Comunicado institucional de rutina (acto, curso, inscripcion generica, protocolo).
    rutina_institucional: 25
    # Politica nacional de rutina (internas, chicanas de Buenos Aires, sin impacto en Salta).
    politica_nacional_rutinaria: 30
    # Nota de un medio salteno sin relacion con Salta: no compite como noticia local.
    sin_relacion_salta: 25
  # Puntaje minimo para entrar a la cola (no se rellenan cupos con material flojo).
  thresholds:
    # Recalibrado 2026-10-18 con 119 notas locales de 24 h: con 55 pasaban 26 por dia y quedaban
    # afuera notas publicables de 45-55 (accidente en El Carril, fiestas clandestinas, suba de
    # alimentos, Central Norte, litio). Con 45 pasan ~39.
    local: 45
    local_official: 58
    # Calibrado 2026-10-18 (13 notas con video, 3 reevaluaciones): el hecho nacional grave del
    # dia promedio 73.9 (rango 66-76.5); lo siguiente promedio 41.6 o menos.
    national: 60
    # Paparazzi: Dibu 83, Confessore 44, figuras conocidas 32-34, notas flojas 27-28.
    paparazzi: 32
    x_feed: 55
  # Lote de notas por llamada de evaluacion.
  batch_size: 12
  # Texto maximo de cada nota que se envia a la evaluacion (titulo + bajada + inicio).
  max_chars_per_item: 700

media:
  # Reel = un unico tramo de video, nunca carruseles de partes (decision 2026-10-18).
  max_reel_seconds: 90
  # Video mas largo que max_reel_seconds: se publican sus primeros 90 s (decision 2026-10-20).
  # En false, no se usa: la nota local sigue con imagen y Paparazzi, TN e Infobae se descartan.
  trim_long_videos: true
  # Un video mas corto que esto no es un video de la nota (previews animados de 2 s).
  min_video_seconds: 5
  max_download_mb: 400

llm:
  # Version de los prompts: cambia la clave de cache de captions y evaluaciones.
  prompt_version: duo-2026-10-v4
  # Tarifas estandar por millon de tokens (USD), por modelo, para estimar costos con tokens reales.
  # Fuente: https://ai.google.dev/gemini-api/docs/pricing (consultado 2026-10-18). Modelo sin
  # tarifa = costo no estimado. El respaldo ante 503 es GEMINI_FALLBACK_MODEL (3.5-flash-lite).
  rates_per_million:
    gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
